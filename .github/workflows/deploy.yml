name: Build & Deploy React (Next static export) → GoDaddy FTP

on:
  push:
    branches: [main]          # deploy automatico da main
  workflow_dispatch:          # avvio manuale

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2) Node + cache npm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3) Install e build
      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js production)
        run: npm run build             # crea .next/

      - name: Export → static site
        run: npx next export -o out    # crea ./out/

      # 4) Deploy via FTP (solo cartella out/)
      - name: Upload out/ to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir:  ./out/           # artefatto da caricare
          server-dir: ./               # cartella di destinazione sul server
          #dangerous-clean-slate: true # decommenta se vuoi pulizia completa

      # 5) (facoltativo) aggiorna il branch deploy con i file generati
      - name: Sync main → deploy branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git --work-tree out add .
          git --work-tree out commit -m "CI deploy $(date +'%Y-%m-%d %H:%M')"
          git push --force origin deploy

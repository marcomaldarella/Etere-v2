name: Build & Deploy React to GoDaddy (FTP)

on:
  push:
    branches: [main]          # build+deploy automatico su push in main
  workflow_dispatch:          # oppure esecuzione manuale

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -- 1. Checkout del codice
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # -- 2. Setup Node.js + cache npm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # -- 3. Install deps e build di produzione
      - name: Install dependencies
        run: npm ci
      - name: Build React app
        run: npm run build                          # crea ./build/

      # -- 4. Deploy via FTP SOLO la cartella build
      - name: Upload build/ to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: './build/'                     # ← artefatto da deployare
          server-dir: './'
          # dangerous-clean-slate: true            # scommenta se vuoi wipe completo prima del deploy

      # -- 5. (Opzionale) allinea il ramo deploy
      - name: Sync main → deploy branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git --work-tree build add .
          git --work-tree build commit -m "CI deploy $(date +'%Y-%m-%d %H:%M')"
          git push --force origin deploy

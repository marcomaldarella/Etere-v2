name: Build & Deploy React to GoDaddy (FTP)

on:
  push:
    branches: [main]          # deploy automatico ad ogni push su main
  workflow_dispatch:          # o esecuzione manuale

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout del codice
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2) Setup Node.js (con cache npm)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3) Install dipendenze e build di produzione
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js app
        run: npm run build
      - name: Export static site
        run: npx next export               # genera la cartella ./out/

      # 4) Deploy via FTP solo la cartella out/
      - name: Upload out/ to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: './out/'              # artefatto da caricare
          server-dir: './'                 # cambia se il root non è /
          # dangerous-clean-slate: true    # sblocca se vuoi pulire prima

      # 5) (opzionale) aggiorna il branch deploy con il contenuto esportato
      - name: Sync main → deploy branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git --work-tree out add .
          git --work-tree out commit -m "CI deploy $(date +'%Y-%m-%d %H:%M')"
          git push --force origin deploy

name: Build & Deploy React to GoDaddy (FTP)

on:
  push:
    branches: [main]          # deploy automatico
  workflow_dispatch:          # avvio manuale

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1) Checkout
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    # 2) Node + cache
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    # 3) Install & build (genera ./out/)
    - name: Install dependencies
      run: npm ci

    - name: Build Next.js app (static export)
      run: npm run build          # ‘next build’ ora produce out/

    # 4) Deploy via FTP
    - name: Upload out/ to GoDaddy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server:   ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftp
        local-dir: './out/'       # cartella generata dal build
        server-dir: './'          # cambialo se il root non è /
        # dangerous-clean-slate: true

    # 5) (opzionale) aggiorna branch deploy
    - name: Sync main → deploy branch
      if: github.ref == 'refs/heads/main'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name  "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git checkout --orphan deploy
        git --work-tree out add .
        git --work-tree out commit -m "CI deploy $(date +'%Y-%m-%d %H:%M')"
        git push --force origin deploy

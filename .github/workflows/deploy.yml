name: Build & Deploy static site to GoDaddy

on:
  push:
    branches: [ main ]        # parte ad ogni push su main
  workflow_dispatch:          # avviabile a mano

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1) Checkout sorgenti
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    # 2) Node + cache npm
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # 3) Install dipendenze e build
    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build       # CRA → build/   | Vite → dist/   | Next export → out/

    # 4) Rileva la cartella risultante
    - name: Detect build dir
      id: detect
      run: |
        if [ -d build ]; then
          echo "DIR=build" >> $GITHUB_OUTPUT
        elif [ -d dist ]; then
          echo "DIR=dist" >> $GITHUB_OUTPUT
        elif [ -d out ]; then
          echo "DIR=out" >> $GITHUB_OUTPUT
        else
          echo "❌ Cartella di build non trovata"; exit 1
        fi

    # 5) Deploy via FTP
    - name: Upload to GoDaddy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server:   ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftp
        local-dir: ${{ steps.detect.outputs.DIR }}/
        server-dir: ./              # o /public_html/ se GoDaddy lo richiede
        # dangerous-clean-slate: true   # se vuoi svuotare prima

